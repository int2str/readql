<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadQL Studio</title>
  <meta name="readql-api-port" content="{{API_PORT}}">
  <style>
    :root {
      --bg-darker: #090d16;
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2e3d56;
      --success: #34d399;
      --error: #f87171;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      background: var(--bg-darker);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .status-dot.offline {
      background: var(--error);
      box-shadow: 0 0 6px var(--error);
    }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bg-darker);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 0.75rem 1rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .table-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.6rem;
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-family: var(--font-mono);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .table-item:hover {
      background: var(--bg-surface);
      color: var(--accent);
    }

    .table-icon {
      color: var(--accent);
      font-size: 0.9rem;
    }

    /* Main Content */
    .main-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
    }

    /* Editor Section */
    .editor-section {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .editor-container {
      position: relative;
    }

    textarea#sql-editor {
      width: 100%;
      height: 100px;
      background: var(--bg-darker);
      color: #e0f2fe;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.45;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease;
    }

    textarea#sql-editor:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #032030;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #000;
    }

    .btn-secondary {
      background: var(--bg-darker);
      color: var(--text-main);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: var(--text-muted);
    }

    .shortcut-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 0.25rem;
    }

    /* History select */
    select#query-history {
      background: var(--bg-darker);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.38rem 0.6rem;
      font-size: 0.78rem;
      outline: none;
      max-width: 200px;
    }

    select#query-history:focus {
      color: var(--text-main);
      border-color: var(--accent);
    }

    /* Status & Stats Bar */
    .stats-bar {
      padding: 0.4rem 1rem;
      background: #0c1322;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .stats-metrics {
      display: flex;
      gap: 1.25rem;
    }

    .stat-badge {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Results Table Container */
    .results-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      position: relative;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .error-banner {
      margin: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 6px;
      color: var(--error);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
    }

    table.data-grid {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      table-layout: auto;
    }

    table.data-grid th, table.data-grid td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    table.data-grid th {
      background: #182234;
      position: sticky;
      top: 0;
      z-index: 10;
      color: #38bdf8;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    table.data-grid tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    table.data-grid tr:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    .row-index {
      color: #64748b;
      user-select: none;
      width: 40px;
      text-align: right;
    }

    /* Modal dialog */
    dialog {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
    }

    dialog pre {
      background: var(--bg-darker);
      padding: 0.75rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      overflow-x: auto;
      margin: 0.75rem 0;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <span>⚡ ReadQL</span>
      <span class="brand-badge">Studio</span>
    </div>
    <div class="header-controls">
      <div class="api-status">
        <span id="status-indicator" class="status-dot"></span>
        <span id="api-endpoint-label">Connected</span>
      </div>
      <button class="btn btn-secondary" onclick="openSettingsDialog()" title="Settings">⚙ Settings</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="layout">
    <!-- Sidebar: Tables Explorer -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Tables</span>
        <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="loadTables()" title="Refresh tables">↻</button>
      </div>
      <div id="table-list" class="sidebar-content">
        <div style="padding: 0.5rem; color: var(--text-muted); font-size: 0.8rem;">Loading tables...</div>
      </div>
    </aside>

    <!-- Main Workspace Content -->
    <main class="main-pane">
      <!-- Editor & Action Toolbar -->
      <section class="editor-section">
        <div class="editor-container">
          <textarea id="sql-editor" spellcheck="false" placeholder="SELECT * FROM temperatures LIMIT 100">SELECT * FROM temperatures LIMIT 100</textarea>
        </div>
        <div class="editor-toolbar">
          <div class="toolbar-left">
            <button class="btn btn-primary" id="run-btn" onclick="executeQuery()">
              ▶ Run Query
            </button>
            <span class="shortcut-hint">(Ctrl+Enter)</span>
            <select id="query-history" onchange="loadFromHistory(this.value)">
              <option value="">History</option>
            </select>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-secondary" onclick="exportData('csv')" title="Download query output as CSV">
              ⬇ CSV
            </button>
            <button class="btn btn-secondary" onclick="copySnippet('pandas')" title="Copy Python Pandas ingestion snippet">
              📋 Pandas
            </button>
            <button class="btn btn-secondary" onclick="copySnippet('polars')" title="Copy Python Polars ingestion snippet">
              📋 Polars
            </button>
          </div>
        </div>
      </section>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stats-metrics">
          <div>Status: <span id="stat-status" class="stat-badge">Ready</span></div>
          <div>Rows: <span id="stat-rows" class="stat-badge">-</span></div>
          <div>Duration: <span id="stat-duration" class="stat-badge">-</span></div>
          <div>Size: <span id="stat-size" class="stat-badge">-</span></div>
        </div>
        <div id="stat-timestamp" style="font-size: 0.72rem;"></div>
      </div>

      <!-- Results Grid -->
      <div class="results-container" id="results-area">
        <div class="empty-state">
          <span>Press <strong>Run Query</strong> or hit <strong>Ctrl + Enter</strong> to execute.</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Dialog -->
  <dialog id="settings-dialog">
    <h3 style="margin-bottom: 0.75rem;">Endpoint Settings</h3>
    <label style="display: block; font-size: 0.8rem; margin-bottom: 0.4rem; color: var(--text-muted);">API Server Base URL:</label>
    <input type="text" id="custom-api-url" style="width: 100%; padding: 0.5rem; background: var(--bg-darker); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem; margin-bottom: 1rem;">
    <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
      <button class="btn btn-secondary" onclick="closeSettingsDialog()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </dialog>

  <!-- Script Implementation -->
  <script>
    // Resolve target API URL
    const metaPort = document.querySelector('meta[name="readql-api-port"]')?.content || '8002';
    const defaultApiUrl = `${window.location.protocol}//${window.location.hostname}:${metaPort}`;
    let apiUrl = localStorage.getItem('readql_api_url') || defaultApiUrl;

    const editor = document.getElementById('sql-editor');
    const resultsArea = document.getElementById('results-area');
    const historySelect = document.getElementById('query-history');
    const statusIndicator = document.getElementById('status-indicator');
    const apiLabel = document.getElementById('api-endpoint-label');

    const MAX_HISTORY = 15;
    let queryHistory = JSON.parse(localStorage.getItem('readql_history') || '[]');

    function updateApiLabel() {
      apiLabel.innerText = apiUrl.replace(/^https?:\/\//, '');
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${apiUrl}/?sql=SELECT+1`, { method: 'GET' });
        if (res.ok) {
          statusIndicator.className = 'status-dot';
          return true;
        }
      } catch (e) {}
      statusIndicator.className = 'status-dot offline';
      return false;
    }

    async function loadTables() {
      const container = document.getElementById('table-list');
      container.innerHTML = '<div style="padding: 0.5rem; color: var(--text-muted); font-size: 0.8rem;">Loading tables...</div>';
      try {
        const res = await fetch(`${apiUrl}/?sql=${encodeURIComponent("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;")}`);
        if (!res.ok) throw new Error(await res.text());
        const csv = await res.text();
        const lines = csv.trim().split('\n').slice(1).map(l => l.trim()).filter(Boolean);

        if (lines.length === 0) {
          container.innerHTML = '<div style="padding: 0.5rem; color: var(--text-muted); font-size: 0.8rem;">No tables found</div>';
          return;
        }

        container.innerHTML = lines.map(t => `
          <div class="table-item" onclick="selectTable('${t}')">
            <span class="table-icon">📄</span>
            <span>${t}</span>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div style="padding: 0.5rem; color: var(--error); font-size: 0.78rem;">Failed to load tables</div>`;
      }
    }

    function selectTable(tableName) {
      editor.value = `SELECT * FROM ${tableName} LIMIT 100`;
      executeQuery();
    }

    function pushHistory(query) {
      if (!query || queryHistory[0] === query) return;
      queryHistory = [query, ...queryHistory.filter(q => q !== query)].slice(0, MAX_HISTORY);
      localStorage.setItem('readql_history', JSON.stringify(queryHistory));
      renderHistory();
    }

    function renderHistory() {
      historySelect.innerHTML = '<option value="">History</option>' +
        queryHistory.map((q, idx) => `<option value="${encodeURIComponent(q)}">${q.length > 35 ? q.substring(0, 32) + '...' : q}</option>`).join('');
    }

    function loadFromHistory(val) {
      if (!val) return;
      editor.value = decodeURIComponent(val);
      historySelect.value = '';
      executeQuery();
    }

    // CSV parser handling quoted strings and commas
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          currentRow.push(currentVal);
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal);
          currentVal = '';
          if (currentRow.length > 1 || currentRow[0] !== '') {
            rows.push(currentRow);
          }
          currentRow = [];
        } else {
          currentVal += char;
        }
      }

      if (currentVal || currentRow.length > 0) {
        currentRow.push(currentVal);
        if (currentRow.length > 1 || currentRow[0] !== '') {
          rows.push(currentRow);
        }
      }

      return rows;
    }

    async function executeQuery() {
      const sql = editor.value.trim();
      if (!sql) return;

      const runBtn = document.getElementById('run-btn');
      runBtn.innerText = '⏳ Running...';
      runBtn.disabled = true;

      document.getElementById('stat-status').innerText = 'Querying...';
      document.getElementById('stat-rows').innerText = '-';
      document.getElementById('stat-duration').innerText = '-';
      document.getElementById('stat-size').innerText = '-';

      const t0 = performance.now();

      try {
        const res = await fetch(`${apiUrl}/?sql=${encodeURIComponent(sql)}&format=csv`);
        const durationMs = (performance.now() - t0).toFixed(1);

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText);
        }

        const rawText = await res.text();
        const payloadBytes = new Blob([rawText]).size;
        const rows = parseCSV(rawText);

        pushHistory(sql);
        statusIndicator.className = 'status-dot';

        if (rows.length === 0 || (rows.length === 1 && rows[0].length === 0)) {
          resultsArea.innerHTML = '<div class="empty-state">Query completed: 0 rows returned.</div>';
          document.getElementById('stat-status').innerText = 'Success';
          document.getElementById('stat-rows').innerText = '0';
          document.getElementById('stat-duration').innerText = `${durationMs} ms`;
          document.getElementById('stat-size').innerText = formatBytes(payloadBytes);
          return;
        }

        const headers = rows[0];
        const dataRows = rows.slice(1);

        // Build HTML table
        let tableHtml = '<table class="data-grid"><thead><tr><th class="row-index">#</th>';
        for (const h of headers) {
          tableHtml += `<th>${escapeHtml(h)}</th>`;
        }
        tableHtml += '</tr></thead><tbody>';

        for (let i = 0; i < dataRows.length; i++) {
          const row = dataRows[i];
          tableHtml += `<tr><td class="row-index">${i + 1}</td>`;
          for (let j = 0; j < headers.length; j++) {
            const cell = row[j] !== undefined ? row[j] : '';
            tableHtml += `<td title="${escapeHtml(cell)}">${escapeHtml(cell)}</td>`;
          }
          tableHtml += '</tr>';
        }
        tableHtml += '</tbody></table>';

        resultsArea.innerHTML = tableHtml;

        document.getElementById('stat-status').innerText = 'Success';
        document.getElementById('stat-rows').innerText = dataRows.length.toLocaleString();
        document.getElementById('stat-duration').innerText = `${durationMs} ms`;
        document.getElementById('stat-size').innerText = formatBytes(payloadBytes);
        document.getElementById('stat-timestamp').innerText = new Date().toLocaleTimeString();

      } catch (err) {
        statusIndicator.className = 'status-dot offline';
        resultsArea.innerHTML = `<div class="error-banner"><strong>Query Execution Error:</strong>\n\n${escapeHtml(err.message)}</div>`;
        document.getElementById('stat-status').innerText = 'Error';
      } finally {
        runBtn.innerText = '▶ Run Query';
        runBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function exportData(format) {
      const sql = editor.value.trim();
      if (!sql) return;
      window.open(`${apiUrl}/?sql=${encodeURIComponent(sql)}&format=${format}`, '_blank');
    }

    function copySnippet(type) {
      const sql = editor.value.trim();
      let code = '';
      if (type === 'pandas') {
        code = `import io, requests, pandas as pd\n\nresp = requests.get("${apiUrl}/?sql=${encodeURIComponent(sql)}&format=parquet")\ndf = pd.read_parquet(io.BytesIO(resp.content))`;
      } else if (type === 'polars') {
        code = `import io, requests, polars as pl\n\nresp = requests.get("${apiUrl}/?sql=${encodeURIComponent(sql)}&format=parquet")\ndf = pl.read_parquet(io.BytesIO(resp.content))`;
      }

      navigator.clipboard.writeText(code).then(() => {
        const statStatus = document.getElementById('stat-status');
        const oldText = statStatus.innerText;
        statStatus.innerText = `Copied ${type.toUpperCase()} snippet!`;
        setTimeout(() => { statStatus.innerText = oldText; }, 2000);
      });
    }

    function openSettingsDialog() {
      document.getElementById('custom-api-url').value = apiUrl;
      document.getElementById('settings-dialog').showModal();
    }

    function closeSettingsDialog() {
      document.getElementById('settings-dialog').close();
    }

    function saveSettings() {
      const val = document.getElementById('custom-api-url').value.trim();
      if (val) {
        apiUrl = val.replace(/\/+$/, '');
        localStorage.setItem('readql_api_url', apiUrl);
        updateApiLabel();
        checkHealth();
        loadTables();
      }
      closeSettingsDialog();
    }

    // Keyboard shortcut (Ctrl+Enter / Cmd+Enter)
    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        executeQuery();
      }
    });

    // Initialize
    updateApiLabel();
    renderHistory();
    checkHealth();
    loadTables();
  </script>
</body>
</html>
