[package]
name = "readql"
version = "0.1.0"
edition = "2024"
description = "High-throughput read-only SQLite HTTP query server"
license = "GPL-2.0-only"
readme = "README.md"
authors = ["Andre Eisenbach <git@4ae.us>"]

[dependencies]
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
itoa = "1.0"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-rusqlite = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
