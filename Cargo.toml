[package]
name = "readql"
version = "0.1.0"
edition = "2024"
description = "High-throughput read-only SQLite HTTP query server"
license = "GPL-2.0-only"
readme = "README.md"
authors = ["Andre Eisenbach <git@4ae.us>"]

[dependencies]
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
axum = "0.8.9"
bytes = "1.0"
clap = { version = "4", features = ["derive"] }
itoa = "1.0"
parquet = "59.2.0"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-rusqlite = { version = "0.7.0", features = ["column_decltype"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

